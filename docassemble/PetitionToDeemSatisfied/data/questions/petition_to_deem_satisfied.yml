---
id: intro_screen
question: |
  Petition to Deem Judgment Satisfied
subquestion: |
  This form asks the court to officially mark your eviction judgment as satisfied because you already paid what you owe. Once the judgment is marked satisfied, it is easier to show future landlords or credit screeners that you resolved the case.

  **You are in the right place if:**

  * The case was for nonpayment of rent
  * A judgment entered against you
  * You paid the full judgment amount (including any agreed interest or costs)

  Massachusetts General Law [Chapter 239, Section 16(k)](https://malegislature.gov/Laws/GeneralLaws/PartIII/TitleIII/Chapter239/Section16) gives you this right.

  **Before you start, grab:**

  * Your court papers with the docket number
  * Proof of payment (receipt, money order stub, bank record)
  * The mailing or email address for the plaintiff or their attorney

  Expect about 10-15 minutes. If you are not sure about an answer, we will give tips along the way.
continue button field: intro_screen_shown
---
id: form_is_right
question: |
  Is this form right for you?
subquestion: |
  You can use this form only if all of these are true:

  * Your case was for nonpayment of rent
  * A judgment entered against you
  * You paid the full judgment amount (including any agreed interest or costs)
fields:
  - I meet all three conditions above: form_is_right
    datatype: yesnoradio
---
id: not_eligible_exit
event: not_eligible_exit
question: |
  This form may not be right for you
subquestion: |
  <div class="alert alert-danger" role="alert" style="border-left: 4px solid #d9534f; padding: 15px; margin: 15px 0;">
    <strong>Stop:</strong> This form is only for tenants who already paid a judgment for nonpayment of rent.
  </div>

  If you have not paid the judgment in full, or your case was not for nonpayment of rent, this petition is
  not the right tool. You may still have options.

  You can:
  * Talk with a legal aid organization or a housing counselor
  * Visit the Massachusetts eviction information page for more resources

  ${ action_button_html("Visit Massachusetts eviction information", "https://www.mass.gov/info-details/evictions", new_window=True) }
buttons:
  - Start over: restart
  - Exit: exit
---
id: trial_court
question: |
  Which court is your case in?
subquestion: |
  Select the court where your eviction case was heard. This is usually a Housing Court or District Court.
fields:
  - no label: trial_court
    datatype: object
    choices: housing_and_district_courts
---
id: docket_number
question: |
  What is your case's docket number?
subquestion: |
  The docket number is on your court papers. It might look like 
  "24H84CV001234" or similar.
fields:
  - Docket number: docket_number
    required: True
    help: |
      Look for a number like "24H84CV001234" on your court papers.
      The "24" is the year, "H84" might be the court code, and the rest is your case number.
---
id: parties
question: |
  Who is the plaintiff in your case?
subquestion: |
  The plaintiff is usually your landlord or the property owner who filed the eviction case against you.
fields:
  - Plaintiff's first name: other_parties[0].name.first
    required: True
  - Middle name: other_parties[0].name.middle
    required: False
  - Last name: other_parties[0].name.last
    required: True
  - Suffix: other_parties[0].name.suffix
    required: False
    choices:
      - Jr.
      - Sr.
      - II
      - III
      - IV
---
id: payment_date
question: |
  When did you pay the judgment?
subquestion: |
  Enter the date you made the final payment that satisfied the judgment. 
  This is the date you want the court to mark as "satisfied."
fields:
  - Payment date: payment_date
    datatype: date
    max: ${ today() }
    help: |
      Enter the date you paid the judgment in full. This cannot be a future date.
validation code: |
  if payment_date > today():
    validation_error("The payment date cannot be in the future.")
---
id: user_info
sets:
  - users[0].name.first
  - users[0].name.last
  - users[0].address.address
  - users[0].address.unit
  - users[0].address.city
  - users[0].address.state
  - users[0].address.zip
question: |
  What is your contact information?
subquestion: |
  We need your name, current address, phone number, and email for the court records.
fields:
  - code: |
      users[0].name_fields()
  - code: |
      users[0].address_fields(default_state="MA")
  - Mobile phone: users[0].phone_number
    datatype: tel
    required: True
  - Email address: users[0].email
    datatype: email
    required: True
---
id: has_attorney
question: |
  Do you have an attorney representing you?
subquestion: |
  An attorney is optional for this form. If you don't have one, just answer "No."
fields:
  - I have an attorney: user_has_attorney
    datatype: yesnoradio
---
id: attorney_info
question: |
  What is your attorney's information?
subquestion: |
  We need your attorney's contact information for the court records.
fields:
  - code: |
      attorneys[0].name_fields()
  - Email address: attorneys[0].email
    datatype: email
    required: True
  - BBO number: attorneys[0].bbo_number
    required: False
    help: |
      The Board of Bar Overseers number (optional). This helps identify your attorney.
show if: user_has_attorney
---
id: service_recipient
question: |
  Who must receive a copy of this petition?
subquestion: |
  Massachusetts rules require you to serve the opposing side. If the plaintiff had a lawyer on the case and you have their contact information, choose the attorney. Otherwise, serve the plaintiff directly.
field: service_recipient
choices:
  - The plaintiff: plaintiff
  - The plaintiff's attorney: plaintiff_attorney
---
id: service_method
question: |
  How will you serve this petition?
subquestion: |
  Choose how you will deliver your petition. For each method, keep proof that you sent it:

  <div class="alert alert-info" role="alert" style="border-left: 4px solid #5bc0de; padding: 15px; margin: 15px 0;">
    <ul>
      <li><strong>First class mail:</strong> keep the receipt or certified mail stub</li>
      <li><strong>In person:</strong> note who accepted it and when</li>
      <li><strong>Email:</strong> save a copy of the sent email</li>
    </ul>
  </div>
field: service_method
choices:
  - First class mail: mail
  - In person: in_person
  - Email: email
---
id: service_date
question: |
  When will you serve this petition?
subquestion: |
  Enter the date you will serve (or have served) this document.
fields:
  - Service date: service_date
    datatype: date
    help: |
      Enter the date you will serve this petition. This can be today or a future date.
---
id: service_address
question: |
  What address will you mail the petition to?
subquestion: |
  Enter the complete address where you will mail the petition. Make sure it matches what you have for the plaintiff or their attorney.
fields:
  - code: |
      service_contact.address_fields(default_state="MA")
show if: service_method == 'mail'
continue button field: service_address
---
id: service_email
question: |
  What email address will you use for service?
subquestion: |
  Enter the email address where you will send the petition. Send from an account you can access later and keep the sent email.
fields:
  - Email address: service_email
    datatype: email
    required: True
    help: |
      Enter the email address where you will send the petition.
show if: service_method == 'email'
---
id: review_petition
continue button field: review_petition
question: |
  Review your answers
subquestion: |
  Make sure everything looks right before you sign. Click any section to make a change.

  <div class="alert alert-info" role="alert" style="border-left: 4px solid #5bc0de; padding: 15px; margin: 15px 0;">
    <strong>Tip:</strong> Fix anything now so the downloaded petition is ready to serve and file.
  </div>
review:
  - Edit: trial_court
    button: |
      **Court:** ${ trial_court }
  - Edit: docket_number
    button: |
      **Docket number:** ${ docket_number }
  - Edit: other_parties[0].name.first
    button: |
      **Plaintiff:** ${ other_parties[0].name.full() }
  - Edit: payment_date
    button: |
      **Payment date:** ${ payment_date.format('MM/dd/yyyy') }
  - Edit: users[0].name.first
    button: |
      **Your name:** ${ users[0].name.full() }
  - Edit: users[0].address.address
    button: |
      **Your address:** ${ users[0].address.on_one_line() }
  - Edit: users[0].phone_number
    button: |
      **Your phone:** ${ users[0].phone_number }
  - Edit: users[0].email
    button: |
      **Your email:** ${ users[0].email }
  - Edit: user_has_attorney
    button: |
      **Have attorney:** ${ 'Yes' if user_has_attorney else 'No' }
  - Edit: attorneys[0].name.first
    button: |
      **Attorney:** ${ attorneys[0].name.full() if user_has_attorney else 'N/A' }
  - Edit: service_recipient
    button: |
      **Serve to:** ${ 'Plaintiff' if service_recipient == 'plaintiff' else "Plaintiff's attorney" }
  - Edit: service_method
    button: |
      **Service method:** ${ service_method.replace('_', ' ').title() }
  - Edit: service_date
    button: |
      **Service date:** ${ service_date.format('MM/dd/yyyy') }
  - Edit: service_address
    show if: service_method == 'mail'
    button: |
      **Mailing to:** ${ service_contact.on_one_line().replace('\n', ', ') }
  - Edit: service_email
    show if: service_method == 'email'
    button: |
      **Emailing to:** ${ service_email }
---
id: signature
question: |
  Sign your petition
subquestion: |
  Sign your name below to complete your petition.
signature: users[0].signature
under: |
  ${ users[0].name.full() }
---
id: download
event: download
question: |
  Interview complete — your petition is ready!
subquestion: |
  Your Petition to Deem Satisfied is complete. Download it below.

  <div class="alert alert-info" role="alert" style="border-left: 4px solid #5bc0de; padding: 15px; margin: 15px 0;">
    <strong>Remember:</strong> File the petition only after you have served the other party and gathered your proof of payment.
  </div>

  **Next steps:**
  
  1. **Download and print** your petition for your records.
  2. **Serve a copy** on ${ 'the plaintiff' if service_recipient == 'plaintiff' else "the plaintiff's attorney" }
     ${ 'by mail to: ' + service_contact.on_one_line().replace('\n', ', ') if service_method == 'mail' else '' }
     ${ 'by email to: ' + service_email if service_method == 'email' else '' }
     ${ 'in person' if service_method == 'in_person' else '' }
  3. **File the original** with the court clerk. Bring or attach your proof of payment.
  
  **After you file:** The court may contact you or schedule a short hearing. Keep copies of everything you submit and any proof that you served the other party.
  
  A printable **Next steps** document is included in your downloads.

  Need to double-check anything? Use the buttons below to send a copy to yourself or restart the interview.
  
  ${ al_user_bundle.download_list_html() }
  
  ${ al_user_bundle.send_button_html() }
---
attachment:
  name: Next steps
  filename: petition_to_deem_satisfied_next_steps
  variable name: next_steps_document
  content: |
    # Next steps: Petition to Deem Judgment Satisfied

    ## 1. Serve the other side

    Serve a copy of your petition on ${ 'the plaintiff' if service_recipient == 'plaintiff' else "the plaintiff's attorney" }.

    - Service method: ${ service_method.replace('_', ' ').title() }
    - Service date: ${ service_date.format('MM/dd/yyyy') }
    % if service_method == 'mail':
    - Mailing address: ${ service_contact.on_one_line() }
    % endif
    % if service_method == 'email':
    - Email address: ${ service_email }
    % endif

    Keep proof that you served the petition.

    ## 2. File with the court

    File the original petition with the court clerk. Include your proof of payment.

    ## 3. Keep copies

    Keep a copy of the petition and your proof of service for your records.

    ## Questions

    Visit the MassLegalHelp eviction information page for help:
    https://www.masslegalhelp.org/housing-apartments-shelter/eviction-sealing/what-are-requirements-sealing-my-eviction-record
